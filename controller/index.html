<!doctype html>
<html lang="en" data-theme="stellar-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fleavo — Controller</title>
    <link rel="icon" type="image/webp" href="/assets/favicon.webp" />
    <link rel="preload" as="image" href="/assets/logo.webp" fetchpriority="high" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="controller-shell">
      <img
        class="brand-logo"
        src="/assets/logo.webp"
        width="96"
        height="72"
        alt="Fleavo"
        fetchpriority="high"
        decoding="async"
      />

      <div class="card">
        <h1 class="card-title">Join a room</h1>

        <form id="join-form" class="join-form">
          <label for="room-code">Enter your code</label>
          <input
            id="room-code"
            name="room-code"
            class="code-input"
            maxlength="4"
            autocomplete="off"
            autocapitalize="characters"
            placeholder="7K2M"
          />

          <label for="name">Your name</label>
          <input
            id="name"
            name="name"
            maxlength="20"
            autocomplete="off"
            placeholder="Alex"
          />

          <button type="submit">JOIN ROOM</button>
          <p id="error" class="error"></p>
        </form>
      </div>

      <section id="waiting" class="waiting hidden card">
        <p class="status">Good to see you! Waiting for the host to start a game…</p>
        <p id="study-summary" class="study-summary">The shared study board is ready when your host is.</p>
      </section>

      <section id="controller-view" class="controller-view hidden">
        <button id="tap-button" class="tap-button">TAP</button>
      </section>

      <section id="trivia-controller" class="trivia-controller hidden" aria-label="Trivia Rush controls">
        <p class="trivia-status" id="trivia-status">Get ready…</p>
        <div class="trivia-grid" id="trivia-grid">
          <button data-option="A" class="trivia-btn trivia-a">A</button>
          <button data-option="B" class="trivia-btn trivia-b">B</button>
          <button data-option="C" class="trivia-btn trivia-c">C</button>
          <button data-option="D" class="trivia-btn trivia-d">D</button>
        </div>
      </section>

      <section id="color-controller" class="color-controller hidden" aria-label="Color Clash controls">
        <p class="color-status" id="color-status">Match the ink colour, not the word.</p>
        <div class="color-grid" id="color-grid">
          <button data-color="red" class="color-btn color-red">RED</button>
          <button data-color="blue" class="color-btn color-blue">BLUE</button>
          <button data-color="green" class="color-btn color-green">GREEN</button>
          <button data-color="yellow" class="color-btn color-yellow">YELLOW</button>
        </div>
      </section>

      <section id="forest-controller" class="forest-controller hidden" aria-label="High Forest Quest controls">
        <p>High Forest Quest</p>
        <div class="dpad-row"><button data-action="left">◀</button><button data-action="right">▶</button></div>
        <div class="action-grid"><button data-action="jump">JUMP</button><button data-action="fire">FIRE</button><button data-action="sprint">SPRINT</button><button data-action="grapple">GRAPPLE</button></div>
      </section>

      <section id="results-view" class="results-view hidden card">
        <p class="status" id="result-text"></p>
        <p class="status">Waiting for the host…</p>
      </section>

      <nav class="bottom-nav">
        <span class="nav-item disabled">
          <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5" /><path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9" /></svg>
          Home
        </span>
        <span class="nav-item active">
          <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true"><rect x="3" y="8" width="18" height="9" rx="3" /><circle cx="16" cy="11" r="0.6" fill="currentColor" stroke="none" /><circle cx="18" cy="13" r="0.6" fill="currentColor" stroke="none" /></svg>
          Controller
        </span>
        <span class="nav-item disabled">
          <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true"><circle cx="12" cy="8" r="3.2" /><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7" /></svg>
          Profile
        </span>
        <span class="nav-item disabled">
          <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9.5 9.2a2.5 2.5 0 1 1 3.7 2.3c-.9.5-1.2 1-1.2 2" /><circle cx="12" cy="16.6" r="0.6" fill="currentColor" stroke="none" /></svg>
          Help
        </span>
      </nav>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
