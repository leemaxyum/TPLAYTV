<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleavo</title>
    <link rel="icon" type="image/webp" href="/assets/favicon.webp" />
    <link rel="preload" as="image" href="/assets/logo.webp" fetchpriority="high" />
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at 30% 0%, #101c47 0%, #0a1332 45%, #060a1f 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        gap: 1.25rem;
      }
      img {
        width: 140px;
        height: 105px;
        object-fit: cover;
        border-radius: 16px;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
      }
      a {
        color: #fee500;
        font-weight: 700;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <img src="/assets/logo.webp" alt="Fleavo" fetchpriority="high" decoding="async" />
    <p>
      Open <a href="/tv/">/tv</a> on the host PC (this is the console/host
      screen).
    </p>
    <p>
      Open <a href="/controller/">/controller</a> on a phone to join a room.
    </p>
  </body>
</html>
